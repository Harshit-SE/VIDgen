[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "videosdk"
version = "0.1.0"
description = "Search inside videos by what is said and what is seen. Fully offline."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Harsh"}
]
keywords = ["video", "search", "clip", "whisper", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "opencv-python-headless>=4.8,<5",
    "open-clip-torch>=2.24,<3",
    "faster-whisper>=1.0,<2",
    "sentence-transformers>=2.2,<4",
    "faiss-cpu>=1.7,<2",
    "typer>=0.9,<1",
    "tqdm>=4.60",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
videosdk = "videosdk.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/videosdk"]

[tool.ruff]
target-version = "py310"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
